services:
  # Serviciul Web - Aplicația Streamlit + Server TTS
  - type: web
    name: persona
    repo: https://github.com/dariabalteanu3-png/persona.git
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash run.sh"
    plan: free
    envVars:
      - key: PORT
        value: "10000"
